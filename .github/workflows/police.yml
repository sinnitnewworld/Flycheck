name: Police jurisdictions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/police.py, .github/workflows/police.yml]
  schedule:
    - cron: "17 3 * * 1"      # weekly
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/police.py police
      - name: Commit if changed
        run: |
          git config user.name "flycheck-bot"; git config user.email "actions@users.noreply.github.com"
          git add police
          git diff --cached --quiet || (git commit -m "Update police jurisdiction boundaries" && git push)
